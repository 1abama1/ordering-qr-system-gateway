name: Gateway verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci --ignore-scripts
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm test
      - run: npm run build
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v7
        with:
          name: dastor-gateway-windows-x64
          path: |
            target/release/dastor-gateway.exe
            target/release/bundle/nsis/*-setup.exe
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr@1.8.6
      - run: arduino-cli lib install ArduinoJson@6.21.5
      - run: arduino-cli compile --fqbn arduino:avr:uno firmware/arduino/gateway
